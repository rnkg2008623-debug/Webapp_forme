<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

<!-- 背景: home.html と同じ仮のCSS背景。動画に切り替える場合は .bg 内に <video class="bg-media" ...> を追加する -->
<div class="bg" aria-hidden="true">
  <div class="bg-fallback">
    <div class="cliffs cliffs-back"></div>
    <div class="cliffs cliffs-front"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="cloud c4"></div><div class="cloud c5"></div>
  </div>
</div>

<main class="login-wrap">
  <form class="login-card glass" id="login-form" novalidate>
    <h1 class="login-logo">Logo</h1>

    <label class="field" for="user">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <input id="user" name="user" type="text" placeholder="Email or username" autocomplete="username" required>
    </label>

    <label class="field" for="pass">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="16" r="1" fill="currentColor"/></svg>
      <input id="pass" name="pass" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="eye" id="eye" aria-label="パスワードを表示">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
      </button>
    </label>

    <p class="error" id="error" role="alert" hidden></p>

    <button type="submit" class="login-btn">
      <span>Log in</span>
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>

    <p class="signup">Don't have an account? <a href="#" id="signup">Sign up</a></p>
  </form>
</main>

<script src="login.js"></script>
</body>
</html>
