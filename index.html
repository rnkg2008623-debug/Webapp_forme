<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 背景: いまは仮のCSS背景。動画に切り替える場合は .bg-fallback を残したまま
     <video class="bg-media" src="..." autoplay muted loop playsinline></video> を .bg 内に追加する -->
<div class="bg" aria-hidden="true">
  <div class="bg-fallback">
    <div class="cliffs cliffs-back"></div>
    <div class="cliffs cliffs-front"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="cloud c4"></div><div class="cloud c5"></div>
  </div>
</div>

<header class="topbar">
  <a class="logo" href="#">Logo</a>
  <nav class="nav">
    <button class="nav-item" data-target="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5l1.6 2.6 3-.7.7 3 2.9 1.2-1 2.9 1.9 2.4-2.4 1.9.3 3-3 .5-1.4 2.7-2.8-1.3-2.8 1.3-1.4-2.7-3-.5.3-3L2.5 12.5l1.9-2.4-1-2.9 2.9-1.2.7-3 3 .7z"/></svg>
      <span>Settings</span>
    </button>
    <button class="nav-item is-active" data-target="log">
      <svg viewBox="0 0 24 24" class="filled"><path d="M6 2.5h8l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4A1.5 1.5 0 0 1 6 2.5z"/><path class="cut" d="M8.5 12h7M8.5 15h7M8.5 18h4"/></svg>
      <span>Log data</span>
    </button>
    <button class="nav-item" data-target="friend">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <span>Friend</span>
    </button>
    <button class="nav-item" data-target="statistic">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="12" width="4" height="8.5"/><rect x="10" y="4" width="4" height="16.5"/><rect x="16.5" y="9" width="4" height="11.5"/></svg>
      <span>Statistic</span>
    </button>
  </nav>
</header>

<main class="stage">
  <section class="recent glass" id="recent">
    <h2 class="title">Recent log</h2>
    <ul class="list" id="recent-list"></ul>
  </section>
</main>

<aside class="side">
  <section class="panel" id="log">
    <h2 class="title">Log data</h2>
    <ul class="list scroll" id="log-list"></ul>
  </section>

  <section class="panel" id="friend">
    <h2 class="title">Friend</h2>
    <ul class="friends" id="friend-list"></ul>
  </section>

  <section class="panel" id="statistic">
    <h2 class="title">Statistic</h2>
    <svg class="chart" id="chart" viewBox="0 0 230 120" role="img" aria-label="週間の統計"></svg>
  </section>
</aside>

<script src="script.js"></script>
</body>
</html>
