<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<script>document.documentElement.classList.add("auth-pending")</script>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<!-- 背景: いまは仮のCSS背景。動画に切り替える場合は .bg-fallback を残したまま
     <video class="bg-media" src="..." autoplay muted loop playsinline></video> を .bg 内に追加する -->
<div class="bg" aria-hidden="true">
  <div class="bg-fallback">
    <div class="cliffs cliffs-back"></div>
    <div class="cliffs cliffs-front"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="cloud c4"></div><div class="cloud c5"></div>
  </div>
</div>

<header class="topbar">
  <a class="logo" href="#">Logo</a>
  <nav class="nav">
    <button class="nav-item" data-target="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5l1.6 2.6 3-.7.7 3 2.9 1.2-1 2.9 1.9 2.4-2.4 1.9.3 3-3 .5-1.4 2.7-2.8-1.3-2.8 1.3-1.4-2.7-3-.5.3-3L2.5 12.5l1.9-2.4-1-2.9 2.9-1.2.7-3 3 .7z"/></svg>
      <span>Settings</span>
    </button>
    <button class="nav-item is-active" data-target="log">
      <svg viewBox="0 0 24 24" class="filled"><path d="M6 2.5h8l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V4A1.5 1.5 0 0 1 6 2.5z"/><path class="cut" d="M8.5 12h7M8.5 15h7M8.5 18h4"/></svg>
      <span>Log data</span>
    </button>
    <button class="nav-item" data-target="friend">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      <span>Friend</span>
      <span class="badge" id="friend-badge" hidden>0</span>
    </button>
    <button class="nav-item" data-target="statistic">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="12" width="4" height="8.5"/><rect x="10" y="4" width="4" height="16.5"/><rect x="16.5" y="9" width="4" height="11.5"/></svg>
      <span>Statistic</span>
    </button>
    <button class="nav-item" id="logout">
      <svg viewBox="0 0 24 24"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9"/><path d="M16 8l4 4-4 4M20 12H9"/></svg>
      <span>Log out</span>
    </button>
  </nav>
</header>

<main class="stage">
  <section class="recent glass" id="recent">
    <h2 class="title">Recent log</h2>
    <ul class="list" id="recent-list"></ul>
  </section>
</main>

<aside class="side">
  <section class="panel" id="log">
    <h2 class="title">Log data</h2>
    <ul class="list scroll" id="log-list"></ul>
  </section>

  <section class="panel" id="friend">
    <h2 class="title">Friend</h2>
    <ul class="friends" id="friend-list"><li class="fm-empty">読み込み中…</li></ul>
  </section>

  <section class="panel" id="statistic">
    <h2 class="title">Statistic</h2>
    <svg class="chart" id="chart" viewBox="0 0 230 120" role="img" aria-label="週間の統計"></svg>
  </section>
</aside>

<div class="modal" id="friend-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="fm-title">
    <button type="button" class="modal-close" id="fm-close" aria-label="閉じる">×</button>
    <h2 class="title" id="fm-title">Friend</h2>

    <section class="fm-sec">
      <div class="fm-me">
        <div>
          <div class="fm-label">あなた</div>
          <div class="fm-myname" id="fm-name"></div>
        </div>
        <div class="seg" id="status-seg" role="group" aria-label="ステータス">
          <button type="button" data-s="online"><span class="dot online"></span>Online</button>
          <button type="button" data-s="busy"><span class="dot busy"></span>Busy</button>
        </div>
      </div>
      <div class="fm-codebox">
        <span class="fm-label">あなたのフレンドコード</span>
        <code id="fm-code"></code>
        <button type="button" class="fm-btn" id="fm-copy">コピー</button>
      </div>
    </section>

    <section class="fm-sec">
      <h3>フレンドを追加</h3>
      <form class="fm-add" id="fm-add" novalidate>
        <input id="fm-code-input" type="text" placeholder="相手のフレンドコード (XXXX-XXXX)" maxlength="12" autocomplete="off" spellcheck="false" aria-label="相手のフレンドコード">
        <button type="submit" class="fm-btn primary">申請する</button>
      </form>
      <p class="fm-msg" id="fm-msg" role="status" hidden></p>
    </section>

    <section class="fm-sec">
      <h3>届いた申請</h3>
      <ul class="fm-list" id="fm-incoming"></ul>
      <h3>送信した申請</h3>
      <ul class="fm-list" id="fm-outgoing"></ul>
    </section>

    <section class="fm-sec">
      <h3>フレンド</h3>
      <ul class="fm-list" id="fm-friends"></ul>
    </section>
  </div>
</div>

<script src="script.js?v=8"></script>
<script type="module" src="home-auth.js?v=8"></script>
</body>
</html>
